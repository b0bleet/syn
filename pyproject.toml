[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syn-decisions"
version = "0.1.0"
description = "Pretrained Qwen option scoring without answer generation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "transformers>=4.57,<5",
]

[project.optional-dependencies]
local = ["torch>=2.6,<3", "numpy>=1.26,<3", "safetensors>=0.4,<1"]
hub = ["datasets>=3,<5"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
syn = "syn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/syn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


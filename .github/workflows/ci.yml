# Tests on every push and pull request. On main, after the tests pass, a change to src/,
# deploy/runpod/, pyproject.toml or uv.lock cuts a GitHub release, which RunPod rebuilds from.
#
# Releases are off until enabled per repository, so forks never try to release:
#   repository variable  DEPLOY_GPU=true
# Pull requests, including from forks, only run tests with a read-only token and no secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Release regardless of which files changed
        type: choice
        options: [none, gpu]
        default: none

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # CPU-only torch at the locked version; the default Linux wheel pulls ~2.5 GB of CUDA.
      - run: |
          torch=$(awk '/^name = "torch"$/{getline; print; exit}' uv.lock | sed -E 's/version = "(.*)"/\1/')
          uv pip install "torch==$torch" numpy safetensors pillow \
            --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: uv run --no-sync ruff check src tests deploy
      - run: uv run --no-sync ruff format --check src tests deploy
      - run: uv run --no-sync pytest -q

  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.diff.outputs.gpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$DEPLOY" == gpu ]] && gpu=true || gpu=false
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Documentation alone never needs a rebuild.
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -vE '\.md$' || true)
            grep -qE '^(src/|deploy/runpod/|pyproject\.toml$|uv\.lock$)' <<<"$files" && gpu=true || gpu=false
          else
            # First push or rewritten history: nothing to diff against.
            gpu=true
          fi
          echo "gpu=$gpu" >> "$GITHUB_OUTPUT"

  release-gpu:
    needs: [python, changes]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_GPU == 'true' && needs.changes.outputs.gpu == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="deploy-$(date -u +%Y.%m.%d)-$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Deploy $tag" --generate-notes
